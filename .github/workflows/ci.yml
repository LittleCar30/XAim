name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: xaim-ci

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build frontend (includes typecheck)
        run: pnpm build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Evaluation runner tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --bin xaim-eval

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --lib --bin xaim-eval

      - name: Evaluation validator tests
        run: node --test tests/eval/review-validation.test.mjs tests/eval/reference.test.mjs

      - name: React to Rust integration
        if: runner.os == 'Windows'
        run: pnpm test:e2e
